name: Odswiez oferty

on:
  schedule:
    # 5/10/16 UTC = 07:00, 12:00, 18:00 czasu polskiego (lato; zimą godz. wcześniej)
    - cron: "5 5,10,16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r monitor/requirements.txt
      - name: Skan
        continue-on-error: true
        run: python monitor/run.py
      - name: Wgraj index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Odswiezenie ofert $(date -u +%F)"
            git push
          fi
